<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  input::placeholder { color: #B8ACA0; }
</style>
</helmet>

<div style="position:relative; min-height:100vh; width:100%; background:#F5EFEA; font-family:'Noto Sans JP', sans-serif; display:flex; align-items:center; justify-content:center; padding:40px; overflow:hidden;">

  <!-- soft brand wash -->
  <div style="position:absolute; width:680px; height:680px; border-radius:50%; background:radial-gradient(circle, rgba(124,63,66,0.06), rgba(124,63,66,0) 70%); top:-220px; left:-180px; pointer-events:none;"></div>
  <div style="position:absolute; width:560px; height:560px; border-radius:50%; background:radial-gradient(circle, rgba(63,46,46,0.05), rgba(63,46,46,0) 70%); bottom:-200px; right:-150px; pointer-events:none;"></div>

  <!-- top-left brand -->
  <div style="position:absolute; top:34px; left:44px; display:flex; align-items:center; gap:12px;">
    <div style="width:28px; height:28px; background:#3F2E2E; transform:rotate(45deg); border-radius:5px;"></div>
    <div style="font-size:17px; font-weight:700; color:#3F2E2E; letter-spacing:0.04em;">MY CRM</div>
  </div>

  <!-- login card -->
  <div style="position:relative; width:448px; background:#FFFFFF; border:1px solid #E0D6CD; border-radius:16px; box-shadow:0 18px 50px rgba(63,46,46,0.10); padding:52px 48px;">

    <div style="text-align:center;">
      <div style="font-size:12px; font-weight:600; letter-spacing:0.18em; color:#7C3F42; text-transform:uppercase;">Insurance Agency CRM</div>
      <div style="margin-top:14px; font-size:24px; font-weight:700; color:#45403D; letter-spacing:0.02em;">ログイン</div>
    </div>

    <!-- error banner -->
    <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:28px; display:flex; align-items:flex-start; gap:10px; padding:12px 14px; background:#FAE2E2; border:1px solid #E8A8A8; border-radius:8px;">
        <div style="width:18px; height:18px; flex:none; margin-top:1px; border-radius:50%; background:#A12E2E; color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">!</div>
        <div style="font-size:13px; color:#A12E2E; line-height:1.6;">メールアドレスまたはパスワードが正しくありません。</div>
      </div>
    </sc-if>

    <div style="margin-top:32px;">
      <label style="display:block; font-size:13px; font-weight:600; color:#7A7066; margin-bottom:8px; letter-spacing:0.02em;">メールアドレス</label>
      <input type="email" placeholder="admin@example.com" style="width:100%; height:54px; padding:0 16px; border:1px solid #E0D6CD; border-radius:8px; background:#FFFFFF; font-size:15px; color:#45403D; font-family:inherit; outline:none; transition:border-color .15s, box-shadow .15s;" style-focus="border-color:#7C3F42; box-shadow:0 0 0 3px rgba(124,63,66,0.10);">
    </div>

    <div style="margin-top:22px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <label style="font-size:13px; font-weight:600; color:#7A7066; letter-spacing:0.02em;">パスワード</label>
        <button onClick="{{ togglePw }}" style="border:none; background:none; padding:0; font-size:12px; font-weight:600; color:#7C3F42; cursor:pointer; font-family:inherit;">{{ pwLabel }}</button>
      </div>
      <input type="{{ pwType }}" placeholder="パスワードを入力" style="width:100%; height:54px; padding:0 16px; border:1px solid #E0D6CD; border-radius:8px; background:#FFFFFF; font-size:15px; color:#45403D; font-family:inherit; outline:none; transition:border-color .15s, box-shadow .15s;" style-focus="border-color:#7C3F42; box-shadow:0 0 0 3px rgba(124,63,66,0.10);">
    </div>

    <div style="margin-top:18px; display:flex; justify-content:space-between; align-items:center;">
      <label style="display:flex; align-items:center; gap:9px; font-size:13px; color:#7A7066; cursor:pointer; user-select:none;">
        <input type="checkbox" style="width:16px; height:16px; accent-color:#7C3F42; cursor:pointer;">
        ログイン状態を保持
      </label>
      <a href="#" style="font-size:13px; font-weight:600; color:#7C3F42; text-decoration:none;">パスワードをお忘れですか？</a>
    </div>

    <button disabled="{{ loading }}" style="{{ btnStyle }}" style-hover="{{ btnHover }}">{{ btnLabel }}</button>

    <div style="margin-top:26px; display:flex; align-items:center; justify-content:center; gap:7px; font-size:12px; color:#9A8F84;">
      <div style="width:6px; height:6px; border-radius:50%; background:#2E6B3E;"></div>
      SSL暗号化により通信は保護されています
    </div>
  </div>

  <!-- footer -->
  <div style="position:absolute; bottom:26px; left:0; right:0; text-align:center; font-size:12px; color:#9A8F84;">© 2026 MY CRM ・ 総合保険代理店 業務支援システム</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1280, &quot;height&quot;: 832 },
  &quot;showError&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot; },
  &quot;loading&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot; }
}">
class Component extends DCLogic {
  state = { showPw: false };

  renderVals() {
    const loading = this.props.loading ?? false;
    const baseBtn = "margin-top:30px; width:100%; height:54px; border:none; border-radius:8px; color:#fff; font-size:16px; font-weight:600; font-family:inherit; letter-spacing:0.06em; transition:background .15s;";
    return {
      showError: this.props.showError ?? false,
      loading,
      pwType: this.state.showPw ? "text" : "password",
      pwLabel: this.state.showPw ? "非表示" : "表示",
      togglePw: () => this.setState(s => ({ showPw: !s.showPw })),
      btnLabel: loading ? "サインイン中…" : "ログイン",
      btnStyle: baseBtn + (loading
        ? " background:#A98F8F; cursor:not-allowed;"
        : " background:#7C3F42; cursor:pointer;"),
      btnHover: loading ? "background:#A98F8F;" : "background:#6A3539;",
    };
  }
}
</script>
</body>
</html>
